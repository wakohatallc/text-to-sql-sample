services:
  postgres:
    image: postgres:16-alpine
    container_name: text-to-sql-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: common
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d common"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
